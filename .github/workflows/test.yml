name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
      - uses: ./
        with:
          pooka-version: ">=0.3.1"
      - run: pooka --version
      - run: pooka --help
