name: Set up Pooka
description: Install a released Pooka compiler on Linux or macOS
branding:
  icon: package
  color: orange
inputs:
  pooka-version:
    description: Exact compiler version, such as 0.1.0
    required: true
  compiler-repository:
    description: GitHub repository containing the compiler release
    default: pooka-lang/pooka
outputs:
  pooka-version:
    description: Installed compiler version
runs:
  using: node24
  main: index.mjs
